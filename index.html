<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="wheelScreen" class="screen wheel-screen">
      <h2>Ваша еда ждёт — попробуйте выиграть прямо сейчас!</h2>
      <img src="./img/wheel.webp" alt="wheel" class="wheel" id="wheel">
      <img src="./img/union.webp" alt="union" class="union">
      <input type="submit" value="КРУТИТЬ" id="spinButton">
      <p>Результат определяет сервер</p>
      <div class="gradient"></div>
    </section>

    <section id="resultScreen" class="screen result-screen hidden">
      <h2 id="resultTitle">Ваше бесплатное блюдо: Паста с морепродуктами</h2>
      <div class="bg"></div>
      <img src="./img/1.webp" alt="img" class="food" id="resultFood">
      <img src="./img/message.webp" alt="message" class="message">
      <img src="./img/one.webp" alt="badge" class="badges" id="resultBadge">
      <div class="gradient"></div>
    </section>

    <script src="script.js"></script>
</body>

</html>
